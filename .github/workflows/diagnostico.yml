name: Diagnóstico runners
on:
  push:
    paths: [".github/workflows/diagnostico.yml"]
  workflow_dispatch:
jobs:
  mac-latest:
    runs-on: macos-latest
    steps:
      - run: xcodebuild -version && sw_vers
  mac-15:
    runs-on: macos-15
    steps:
      - run: xcodebuild -version && sw_vers
  mac-26:
    runs-on: macos-26
    steps:
      - run: xcodebuild -version && sw_vers
  mac-13:
    runs-on: macos-13
    steps:
      - run: xcodebuild -version && sw_vers
